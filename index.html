<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#06111f"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="AlberoTV"
  >

  <title>Albero TV</title>

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png?v=20260802-2"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon-32x32.png?v=20260802-2"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icon-192.png?v=20260802-2"
  >

  <link
    rel="stylesheet"
    href="styles.css?v=20260731-1341"
  >

  <link
    rel="stylesheet"
    href="enhancements.css?v=20260827-live-today-1"
  >
</head>

<body>

  <header class="topbar">
    <div class="topbar-inner">

      <a
        class="brand"
        href="#"
        aria-label="Albero TV"
      >
        <span class="brand-albero">ALBERO</span>
        <span class="brand-tv">TV</span>
      </a>

      <nav
        class="category-nav"
        aria-label="Categorías de la programación"
      >
        <div
          class="category-list"
          id="category-list"
          aria-live="polite"
        >
        </div>
      </nav>

    </div>
  </header>

  <main class="main-content">

    <section class="timeline-shell">

      <button
        class="edge-arrow left"
        type="button"
        aria-label="Ver día anterior"
      >
        ‹
      </button>

      <div
        class="timeline"
        id="timeline"
        tabindex="0"
        aria-label="Programación taurina por días"
      >
      </div>

      <button
        class="edge-arrow right"
        type="button"
        aria-label="Ver día siguiente"
      >
        ›
      </button>

    </section>

    <div
      class="hint"
      id="hint"
      aria-hidden="true"
    >
      ← &nbsp; Desliza para explorar &nbsp; →
    </div>

  </main>

  <script src="script.js?v=20260827-live-today-2"></script>

</body>

</html>
