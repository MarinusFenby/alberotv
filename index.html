<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#06111f"
  >

  <title>Albero TV</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <header class="topbar">

    <a
      class="brand"
      href="#"
      aria-label="Albero TV"
    >
      <span class="brand-name">ALBERO</span>
      <span class="brand-tv">TV</span>
    </a>

    <nav
      class="category-nav"
      aria-label="Categorías de la programación"
    >
      <div
        class="category-list"
        id="category-list"
        aria-live="polite"
      >
      </div>
    </nav>

  </header>


  <main>

    <section class="timeline-shell">

      <button
        class="edge-arrow left"
        aria-label="Día anterior"
      >
        ‹
      </button>


      <div
        class="timeline"
        id="timeline"
        tabindex="0"
        aria-label="Programación por días"
      >
      </div>


      <button
        class="edge-arrow right"
        aria-label="Día siguiente"
      >
        ›
      </button>

    </section>


    <div
      class="hint"
      id="hint"
    >
      ← &nbsp; Desliza para explorar &nbsp; →
    </div>

  </main>


  <script src="script.js"></script>

</body>
</html>
