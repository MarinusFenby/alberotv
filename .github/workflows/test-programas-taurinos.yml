name: Probar programas taurinos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-programas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Comprobar versión del scraper
        run: |
          echo "Rama actual:"
          git branch --show-current

          echo "Último commit:"
          git log -1 --oneline

          echo "Versión encontrada en el scraper:"
          grep "2026-07-25-v5-corto" scrapers/programas-taurinos.mjs

      - name: Ejecutar comprobador
        run: node scrapers/programas-taurinos.mjs

      - name: Mostrar resultado
        run: |
          echo "Contenido de data/programas-taurinos.json:"
          cat data/programas-taurinos.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/programas-taurinos.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar programas taurinos"
            git push origin main
          fi
