name: Probar programas taurinos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-programas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ejecutar comprobador
        run: node scrapers/programas-taurinos.mjs

      - name: Mostrar resultado
        run: |
          echo "Contenido de data/programas-taurinos.json:"
          cat data/programas-taurinos.json

      - name: Guardar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/programas-taurinos.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Comprobar programas taurinos"
            git push
          fi
