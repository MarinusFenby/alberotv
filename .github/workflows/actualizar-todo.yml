name: Actualizar programación

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-programacion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright y PDF.js
        run: |
          npm install playwright pdfjs-dist
          npx playwright install --with-deps chromium

      - name: Actualizar OneToro
        run: |
          node scrapers/onetoro.mjs

      - name: Actualizar El Muletazo
        run: |
          node scrapers/elmuletazo.mjs

      - name: Actualizar Canal Sur
        continue-on-error: true
        run: |
          node scrapers/canalsur.mjs

      - name: Actualizar CMM
        continue-on-error: true
        run: |
          node scrapers/cmm.mjs

      - name: Actualizar Canal Extremadura
        continue-on-error: true
        run: |
          node scrapers/canalextremadura.mjs

      - name: Actualizar Mundotoro
        continue-on-error: true
        run: |
          node scrapers/mundotoro.mjs

      - name: Actualizar Las Ventas
        continue-on-error: true
        run: |
          node scrapers/lasventas.mjs

      - name: Actualizar Va de Toros
        continue-on-error: true
        run: |
          node scrapers/vadetoros.mjs

      - name: Actualizar Aplausos
        continue-on-error: true
        run: |
          node scrapers/aplausos.mjs

      - name: Actualizar programas taurinos
        run: |
          node scrapers/programas-taurinos.mjs

      - name: Fusionar programación
        run: |
          node scrapers/merge.mjs

      - name: Comprobar archivos generados
        run: |
          echo "=== OneToro ==="
          test -f data/onetoro.json

          echo "=== El Muletazo ==="
          test -f data/elmuletazo.json

          echo "=== Canal Sur ==="
          test -f data/canalsur.json || true

          echo "=== CMM ==="
          test -f data/cmm.json || true

          echo "=== Canal Extremadura ==="
          test -f data/canalextremadura.json || true

          echo "=== Mundotoro ==="
          test -f data/mundotoro.json || true

          echo "=== Las Ventas ==="
          test -f data/lasventas.json || true

          echo "=== Va de Toros ==="
          test -f data/vadetoros.json || true

          echo "=== Aplausos ==="
          test -f data/aplausos.json || true

          echo "=== Programas taurinos ==="
          test -f data/programas-taurinos.json

          echo "=== Programación fusionada ==="
          test -f data/programacion.json

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar programación"
            git push
          fi
